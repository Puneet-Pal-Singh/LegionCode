name: Desktop macOS Package

on:
  pull_request:
    branches: [dev]
    paths:
      - "apps/desktop/**"
      # Desktop bundles shared workspace source, including transitive dependencies.
      - "packages/**"
      - "package.json"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - ".github/workflows/desktop-package.yml"
  push:
    branches: [dev]
    tags: ["v*-desktop-preview.*"]
    paths:
      - "apps/desktop/**"
      # Desktop bundles shared workspace source, including transitive dependencies.
      - "packages/**"
      - "package.json"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - ".github/workflows/desktop-package.yml"

permissions:
  contents: read

jobs:
  package:
    name: Package unsigned macOS app
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build runtime dependency artifacts
        run: pnpm exec turbo run build --filter=@legioncode/execution-engine

      - name: Check Desktop types and security boundary
        run: |
          pnpm --filter @legioncode/desktop check-types
          pnpm --filter @legioncode/desktop test

      - name: Package and smoke-test the app
        run: |
          pnpm --filter @legioncode/desktop package
          pnpm --filter @legioncode/desktop test:packaged --trace retain-on-failure

      - name: Upload packaged acceptance diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: legioncode-desktop-packaged-test-results
          path: apps/desktop/test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload unsigned Desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: legioncode-desktop-macos-unsigned
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
          if-no-files-found: error

  publish-preview:
    name: Publish unsigned Mac preview
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-desktop-preview.')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/download-artifact@v4
        with:
          name: legioncode-desktop-macos-unsigned
          path: ${{ runner.temp }}/desktop-preview
      - name: Prepare source-pinned assets and checksums
        env:
          PREVIEW_DIRECTORY: ${{ runner.temp }}/desktop-preview
          RELEASE_TAG: ${{ github.ref_name }}
        run: node apps/desktop/scripts/prepare-preview-release.mjs "$PREVIEW_DIRECTORY" "$RELEASE_TAG"
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PREVIEW_DIRECTORY: ${{ runner.temp }}/desktop-preview
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git fetch --no-tags origin "refs/tags/$RELEASE_TAG"
          if [[ "$(git rev-parse 'FETCH_HEAD^{commit}')" != "$GITHUB_SHA" ]]; then
            echo "The preview tag changed after packaging; publication stopped." >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" --verify-tag --target "$GITHUB_SHA" \
            --title "LegionCode Desktop — unsigned Mac preview" \
            --prerelease --latest=false --notes-file "$PREVIEW_DIRECTORY/release-notes.md" \
            "$PREVIEW_DIRECTORY/"*.dmg "$PREVIEW_DIRECTORY/"*.zip "$PREVIEW_DIRECTORY/SHA256SUMS"
