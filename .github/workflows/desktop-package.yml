name: Desktop macOS Package

on:
  pull_request:
    branches: [dev]
    paths:
      - "apps/desktop/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/desktop-package.yml"
  push:
    branches: [dev]
    paths:
      - "apps/desktop/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/desktop-package.yml"

permissions:
  contents: read

jobs:
  package:
    name: Package unsigned macOS app
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Desktop types and security boundary
        run: |
          pnpm --filter @legioncode/desktop check-types
          pnpm --filter @legioncode/desktop test

      - name: Package and smoke-test the app
        run: |
          pnpm --filter @legioncode/desktop package
          pnpm --filter @legioncode/desktop test:packaged

      - name: Upload unsigned Desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: legioncode-desktop-macos-unsigned
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
          if-no-files-found: error
